[package]
name = "loom"
version = "0.1.0"
edition = "2024"
description = "Local shell and SSH terminal client with a Postman-style layout"
license = "MIT"
authors = ["Loom"]

[dependencies]
alacritty_terminal = "0.25.1"
anyhow = "1.0"
dirs = "6"
flume = "0.12"
gpui = "0.2.2"
parking_lot = "0.12"
portable-pty = "0.9"
rfd = "0.15"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4", "serde"] }

[profile.release]
opt-level = 3
lto = "thin"
