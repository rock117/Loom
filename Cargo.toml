[package]
name = "loom"
version = "0.1.0"
edition = "2024"
description = "Local shell and SSH terminal client with a Postman-style layout"
license = "MIT"
authors = ["Loom"]

[dependencies]
alacritty_terminal = "0.25.1"
anyhow = "1.0"
dirs = "6"
flume = "0.12"
gpui = "0.2.2"
keyring = { version = "3", features = ["windows-native", "apple-native"] }
parking_lot = "0.12"
portable-pty = "0.9"
rfd = "0.15"
russh = "0.54"
rust-embed = { version = "8", features = ["interpolate-folder-path"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sysinfo = { version = "0.34", default-features = false, features = ["system"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "time", "sync"] }
uuid = { version = "1", features = ["v4", "serde"] }

[target.'cfg(windows)'.build-dependencies]
embed-resource = "3.0"

# Default for `cargo build` / `cargo run` — keep target/ lean.
[profile.dev]
opt-level = 1
debug = false
strip = "debuginfo"
incremental = false
split-debuginfo = "off"

# Full debug symbols when needed: `cargo build --profile dev-debug`
[profile.dev-debug]
inherits = "dev"
opt-level = 0
debug = true
strip = "none"
incremental = true

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
incremental = false
